services:
  db:
    image: mariadb:11
    environment:
      MYSQL_DATABASE: emendas
      MYSQL_USER: emendas
      MYSQL_PASSWORD: emendas
      MYSQL_ROOT_PASSWORD: desenvolvimento-local
    ports:
      - "3306:3306"
    volumes:
      - emendas_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
  app:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm dev"
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: mysql://emendas:emendas@db:3306/emendas
      PORTAL_TRANSPARENCIA_API_KEY: ${PORTAL_TRANSPARENCIA_API_KEY}
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
volumes:
  emendas_db:
